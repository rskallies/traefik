name: Build ECH Docker Image

on:
  push:
    tags:
      - 'v*-ech.*'
  workflow_dispatch:

env:
  GO_VERSION: '1.26'
  CGO_ENABLED: 0
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/traefik

jobs:

  build-webui:
    uses: ./.github/workflows/template-webui.yaml

  build-binary:
    runs-on: ubuntu-latest
    needs: build-webui
    steps:
      - name: Check out code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Download webui artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: webui.tar.gz

      - name: Untar webui
        run: |
          tar xvf webui.tar.gz
          rm webui.tar.gz

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: amd64
        run: make binary

      - name: Build ech tool
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o dist/linux/amd64/ech ./internal/ech/cmd

      - name: Upload binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: traefik-linux-amd64
          path: dist/linux/amd64/traefik
          retention-days: 1

  build-docker:
    runs-on: ubuntu-latest
    needs: build-binary
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Download binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: traefik-linux-amd64
          path: dist/linux/amd64/

      - name: Build ech tool
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o dist/linux/amd64/ech ./internal/ech/cmd

      - name: Make binaries executable
        run: chmod +x dist/linux/amd64/traefik dist/linux/amd64/ech

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to ghcr.io
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ech-pr11866"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ech-pr11866-${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
