name: Build ECH Docker Image

on:
  push:
    tags:
      - 'v*-ech.*'
  workflow_dispatch:

env:
  GO_VERSION: '1.26'
  CGO_ENABLED: 0
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/traefik

jobs:

  build-webui:
    uses: ./.github/workflows/template-webui.yaml

  build-binary:
    runs-on: ubuntu-latest
    needs: build-webui
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Download webui artifact
        uses: actions/download-artifact@v4
        with:
          name: webui.tar.gz

      - name: Untar webui
        run: |
          tar xvf webui.tar.gz
          rm webui.tar.gz

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: amd64
        run: make binary

      - name: Build ech tool
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o dist/linux/amd64/ech ./internal/ech/cmd

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: traefik-linux-amd64
          path: dist/linux/amd64/traefik
          retention-days: 1

  build-docker:
    runs-on: ubuntu-latest
    needs: build-binary
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: traefik-linux-amd64
          path: dist/linux/amd64/

      - name: Build ech tool
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o dist/linux/amd64/ech ./internal/ech/cmd

      - name: Make binaries executable
        run: chmod +x dist/linux/amd64/traefik dist/linux/amd64/ech

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ech-pr11866
          cache-from: type=gha
          cache-to: type=gha,mode=max
